version: '3'

tasks:
  test:
    desc: Run unit tests with the race detector (needs cgo; CC=cc on nix)
    cmds:
      - go test -race -count=1 ./...
  lint:
    cmds:
      - test -z "$(find . -name '*.go' -not -path './.devcell/*' | xargs gofmt -l | tee /dev/stderr)"
      - go vet ./...
      - golangci-lint run ./...
  example:
    desc: Record every example into docs/assets/<name>.svg, .png and .gif
    cmds:
      - mkdir -p docs/assets
      - for d in examples/*/; do n=$(basename "$d"); go run ./cmd/termproof record -o "docs/assets/$n.svg" -png "docs/assets/$n.png" -gif "docs/assets/$n.gif" -cols 40 -rows 4 -min-cols 20 -min-rows 4 -- go run "./$d"; done
  tidy:
    cmds:
      - go mod tidy
