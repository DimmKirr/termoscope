name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build CLI
        run: |
          out="termproof_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/$out/termproof" ./cmd/termproof
          cp LICENSE README.md "dist/$out/"
          tar -C dist -czf "dist/$out.tar.gz" "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz

  media:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Record example animation and screenshot
        run: |
          mkdir -p dist/examples
          for dir in examples/*/; do
            name=$(basename "$dir")
            go run ./cmd/termproof record \
              -o "dist/examples/$name.svg" -png "dist/examples/$name.png" -gif "dist/examples/$name.gif" \
              -cols 40 -rows 4 -- go run "./$dir"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: media
          path: dist/examples/

  release:
    needs: [build, media]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz > checksums.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            dist/*.tar.gz dist/checksums.txt dist/*.svg dist/*.png dist/*.gif
